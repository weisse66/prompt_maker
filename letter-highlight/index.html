<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подсветка заголовка по буквам</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Пустое место сверху, чтобы было видно, что анимация стартует только при прокрутке к блоку -->
  <section class="spacer">
    <p>Прокрутите вниз ↓</p>
  </section>

  <!-- Блок с заголовком. Анимация запускается, когда этот блок появляется на экране -->
  <section class="hero">
    <h1 class="js-letters">Мы создаём сайты, которые приносят клиентов и продажи</h1>
  </section>

  <section class="spacer"></section>

  <script src="script.js"></script>
</body>
</html>
