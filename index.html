<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор промптов</title>
<style>
  :root{
    --bg: #f2f7f2;
    --surface: #ffffff;
    --surface-soft: #eaf3ea;
    --border: #d6e6d9;
    --text: #2c3a30;
    --text-muted: #6b7d70;
    --primary: #6b9080;
    --primary-dark: #4f6f5a;
    --primary-light: #cfe3d4;
    --accent: #dd9c4c;
    --accent-dark: #b97e34;
    --accent-soft: #f7e7cf;
    --danger: #c9714f;
    --radius: 12px;
    --shadow: 0 2px 10px rgba(79, 111, 90, 0.08);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: "Segoe UI", "PT Sans", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
    padding: 0;
  }
  header{
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color:#fff;
    padding: 22px 28px;
    box-shadow: var(--shadow);
  }
  header h1{
    margin:0 0 4px 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header p{
    margin:0;
    font-size: 13px;
    color: #eaf3ea;
    opacity: 0.9;
  }
  .layout{
    display:grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 20px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: start;
  }
  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; }
  }
  .panel{
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .panel-header{
    padding: 14px 18px;
    background: var(--surface-soft);
    border-bottom: 1px solid var(--border);
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .panel-header h2{
    margin:0;
    font-size: 15px;
    color: var(--primary-dark);
  }
  .panel-body{ padding: 16px 18px; }
  .toolbar{ display:flex; gap:8px; flex-wrap: wrap; }
  button{
    font-family: inherit;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 9px 14px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button:active{ transform: translateY(1px); }
  .btn-primary{
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover{ filter: brightness(1.05); }
  .btn-secondary{
    background: var(--surface);
    color: var(--primary-dark);
    border: 1px solid var(--primary-light);
  }
  .btn-secondary:hover{ background: var(--surface-soft); }
  .btn-danger{
    background: var(--surface);
    color: var(--danger);
    border: 1px solid #ecc9b8;
  }
  .btn-danger:hover{ background: #fbf1ec; }

  details.section{
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: 10px;
    margin-bottom: 12px;
    background: #fbfdfb;
    overflow: hidden;
  }
  details.section[open]{ background: #fdfefd; }
  details.section summary{
    cursor: pointer;
    list-style: none;
    padding: 12px 16px;
    font-weight: 600;
    color: var(--primary-dark);
    display:flex;
    align-items:center;
    gap: 8px;
    background: var(--surface-soft);
  }
  details.section summary::-webkit-details-marker{ display:none; }
  details.section summary::before{
    content: "▸";
    display:inline-block;
    transition: transform 0.15s ease;
    color: var(--accent-dark);
  }
  details.section[open] summary::before{ transform: rotate(90deg); }

  .section-body{ padding: 14px 16px 6px 16px; }
  .field-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
  }
  @media (max-width: 560px){
    .field-grid{ grid-template-columns: 1fr; }
  }
  .field{ display:flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field.full{ grid-column: 1 / -1; }
  label{
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
  }
  label .hint{ font-weight: 400; color: #92a397; }
  input[type="text"], textarea, select{
    font-family: inherit;
    font-size: 13.5px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    outline: none;
  }
  select{ cursor: pointer; }
  input[type="text"]:focus, textarea:focus, select:focus{
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(107, 144, 128, 0.15);
  }
  textarea{ resize: vertical; min-height: 40px; }
  .custom-input{ margin-top: 2px; }
  .en-tag{
    font-size: 11px;
    color: #92a397;
    font-weight: 400;
    font-style: italic;
  }

  .chips{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip{
    font-family: inherit;
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--primary-light);
    background: #fff;
    color: var(--primary-dark);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .chip:hover{ background: var(--surface-soft); }
  .chip.selected{
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
  }

  pre#jsonPreview{
    background: #26332b;
    color: #d8ecdc;
    border-radius: 10px;
    padding: 16px;
    font-size: 12.5px;
    line-height: 1.5;
    max-height: 620px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }
  .status{
    font-size: 12px;
    color: var(--text-muted);
    display:flex;
    align-items:center;
    gap: 6px;
    min-height: 18px;
  }
  .status .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--primary);
  }
  .sticky-actions{
    position: sticky;
    top: 20px;
  }
  .badge{
    display:inline-block;
    background: var(--accent-soft);
    color: var(--accent-dark);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  footer{
    text-align:center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 18px;
  }
</style>
</head>
<body>

<header>
  <h1>🌿 Конструктор промптов</h1>
  <p>Выбирайте варианты на русском — в экспорт автоматически уйдёт готовый промпт на английском</p>
</header>

<div class="layout">

  <!-- ЛЕВАЯ ПАНЕЛЬ: ФОРМА -->
  <div class="panel">
    <div class="panel-header">
      <h2>Параметры промпта</h2>
      <div class="toolbar">
        <button class="btn-secondary" id="loadExampleBtn" type="button">Загрузить пример</button>
        <button class="btn-danger" id="clearBtn" type="button">Очистить всё</button>
      </div>
    </div>
    <div class="panel-body" id="formRoot"></div>
  </div>

  <!-- ПРАВАЯ ПАНЕЛЬ: ПРЕВЬЮ И ЭКСПОРТ -->
  <div class="panel sticky-actions">
    <div class="panel-header">
      <h2>Предпросмотр JSON (EN)</h2>
      <span class="badge">.txt экспорт</span>
    </div>
    <div class="panel-body">
      <pre id="jsonPreview">{}</pre>
      <div style="height:14px"></div>
      <div class="toolbar" style="margin-bottom:10px;">
        <button class="btn-primary" id="exportBtn" type="button">⬇ Экспортировать в .txt</button>
        <button class="btn-secondary" id="copyBtn" type="button">Скопировать JSON</button>
      </div>
      <div class="status"><span class="dot"></span><span id="statusText">Черновик сохраняется автоматически</span></div>
    </div>
  </div>

</div>

<footer>Промпт формируется в реальном времени и сохраняется в браузере, пока вы работаете</footer>

    bg_tones: [

      ["Мягкий песочный", "soft tan"],

      ["Акварель на бумаге", "watercolor on paper"],

      ["Пастель на бумаге", "pastel on paper"]
    ],
    focus: [
      ["Взаимодействие света и атмосферы", "interaction of light and atmosphere"],
      ["Эмоциональное выражение персонажа", "emotional expression of the subject"],
      ["Детали текстуры", "texture details"]
    ],
    palette: [
      ["Приглушённое золото", "muted gold"],
      ["Тёплые земляные тона", "warm earth tones"],
      ["Мягкие бежевые блики", "soft beige highlights"],
      ["Холодные синие тона", "cool blue tones"],
      ["Насыщенные красные акценты", "rich red accents"]
    ],
    atm_tone: [
      ["Спокойное наблюдение", "peaceful observation"],
      ["Напряжённое ожидание", "tense anticipation"],
      ["Ностальгическое настроение", "nostalgic feeling"]
    ],
    atm_intent: [
      ["Запечатлеть момент", "capture"],
      ["Рассказать историю", "narrate a story"],
      ["Вызвать эмоцию", "evoke emotion"]
    ]

  // ---------- Конфигурация секций и полей ----------
  const SECTIONS = [
    { title: "Сцена — общие параметры", open: true, fields: [
      { id: "type", label: "Тип сцены", kind: "select" },
      { id: "style", label: "Стиль", kind: "chips" },
      { id: "mood", label: "Настроение", kind: "chips", full: true }
    ]},
    { title: "Композиция", fields: [
      { id: "comp_framing", label: "Кадрирование" },
      { id: "comp_position", label: "Положение объекта" },
      { id: "comp_setting", label: "Место действия", kind: "select", full: true }
    ]},
    { title: "Субъект / персонаж", fields: [
      { id: "subj_category", label: "Категория" },
      { id: "subj_posture", label: "Поза" },
      { id: "hair_color", label: "Волосы — цвет" },
      { id: "hair_length", label: "Волосы — длина" },
      { id: "hair_texture", label: "Волосы — текстура" },
      { id: "hair_lighting", label: "Волосы — освещение" },
      { id: "skin_tone", label: "Тон кожи" },
      { id: "expression", label: "Выражение лица" },
      { id: "outfit", label: "Одежда — образ" },
      { id: "material", label: "Одежда — материал" },
      { id: "design", label: "Одежда — дизайн", full: true }
    ]},
    { title: "Окружение и освещение", fields: [
      { id: "light_source", label: "Источник света" },
      { id: "light_temp", label: "Цветовая температура" },
      { id: "time_of_day", label: "Время суток" },
      { id: "light_details", label: "Детали света", kind: "chips" },
      { id: "bg_structure", label: "Фон — структура" },
      { id: "bg_depth", label: "Фон — глубина" },
      { id: "bg_tones", label: "Фон — оттенки", kind: "chips", full: true }
    ]},
    { title: "Художественный стиль", fields: [
      { id: "brushwork", label: "Техника мазка" },
      { id: "medium", label: "Материал (medium)" },
      { id: "focus", label: "Фокус" },
      { id: "palette", label: "Палитра", kind: "chips" }
    ]},
    { title: "Атмосфера", fields: [
      { id: "atm_tone", label: "Тональность" },
      { id: "atm_intent", label: "Замысел" }
    ]}
  ];

  const selectFieldIds = [];
  const chipFieldIds = [];

  function el(tag, props, children){
    const node = document.createElement(tag);
    if(props){
      Object.keys(props).forEach(k => {
        if(k === "class") node.className = props[k];
        else if(k === "text") node.textContent = props[k];
        else node.setAttribute(k, props[k]);
      });
    }
    (children || []).forEach(c => node.appendChild(c));
    return node;
  }

  function buildSelectField(field){
    const options = OPT[field.id];
    selectFieldIds.push(field.id);

    const select = el("select", { id: field.id });
    options.forEach(([ru, en]) => {
      select.appendChild(el("option", { value: en, text: ru }));
    });
    select.appendChild(el("option", { value: CUSTOM_VALUE, text: "Другое (свой вариант)" }));

    const customInput = el("input", {
      type: "text", id: field.id + "_custom", class: "custom-input",
      placeholder: "Введите значение на английском", style: "display:none"
    });

    select.addEventListener("change", () => {
      customInput.style.display = select.value === CUSTOM_VALUE ? "block" : "none";
      updatePreview();
    });
    customInput.addEventListener("input", updatePreview);

    const wrap = el("div", { class: "field" + (field.full ? " full" : "") }, [
      el("label", { text: field.label }),
      select,
      customInput
    ]);
    return wrap;
  }

  function buildChipsField(field){
    const options = OPT[field.id];
    chipFieldIds.push(field.id);

    const chipsBox = el("div", { class: "chips", id: field.id + "_chips" });
    options.forEach(([ru, en]) => {
      const chip = el("button", { type: "button", class: "chip", "data-en": en, text: ru });
      chip.addEventListener("click", () => {
        chip.classList.toggle("selected");
        updatePreview();
      });
      chipsBox.appendChild(chip);
    });

    const customInput = el("input", {
      type: "text", id: field.id + "_custom", class: "custom-input",
      placeholder: "Добавить своё (на английском, через запятую)"
    });
    customInput.addEventListener("input", updatePreview);

    const wrap = el("div", { class: "field" + (field.full ? " full" : "") }, [
      el("label", { text: field.label }),
      chipsBox,
      customInput
    ]);
    return wrap;
  }

  function renderForm(){
    const root = document.getElementById("formRoot");
    SECTIONS.forEach(section => {
      const grid = el("div", { class: "field-grid" });
      section.fields.forEach(field => {
        const kind = field.kind || "select";
        grid.appendChild(kind === "chips" ? buildChipsField(field) : buildSelectField(field));
      });
      const details = el("details", { class: "section" }, [
        el("summary", { text: section.title }),
        el("div", { class: "section-body" }, [grid])
      ]);
      if(section.open) details.setAttribute("open", "");
      root.appendChild(details);
    });
  }

  // ---------- Чтение значений ----------
  function getSelectValue(id){
    const select = document.getElementById(id);
    if(select.value === CUSTOM_VALUE){
      return document.getElementById(id + "_custom").value.trim();
    }
    return select.value;
  }

  function getChipsValue(id){
    const chips = document.querySelectorAll("#" + id + "_chips .chip.selected");
    const values = Array.from(chips).map(c => c.getAttribute("data-en"));
    const customRaw = document.getElementById(id + "_custom").value.trim();
    if(customRaw){
      customRaw.split(",").map(s => s.trim()).filter(Boolean).forEach(v => values.push(v));
    }
    return values;
  }

  function buildPrompt(){
    const scene = {
      type: getSelectValue("type"),
      style: getChipsValue("style"),
      mood: getChipsValue("mood"),
      composition: {
        framing: getSelectValue("comp_framing"),
        subject_position: getSelectValue("comp_position"),
        setting: getSelectValue("comp_setting")
      },
      subject: {
        category: getSelectValue("subj_category"),
        appearance: {
          hair: {
            color: getSelectValue("hair_color"),
            length: getSelectValue("hair_length"),
            texture: getSelectValue("hair_texture"),
            lighting: getSelectValue("hair_lighting")
          },
          skin_tone: getSelectValue("skin_tone"),
          expression: getSelectValue("expression")
        },
        clothing: {
          outfit: getSelectValue("outfit"),
          material: getSelectValue("material"),
          design: getSelectValue("design")
        },
        posture: getSelectValue("subj_posture")
      },
      environment: {
        lighting: {
          source: getSelectValue("light_source"),
          color_temperature: getSelectValue("light_temp"),
          time_of_day: getSelectValue("time_of_day"),
          details: getChipsValue("light_details")
        },
        background: {
          structure: getSelectValue("bg_structure"),
          tones: getChipsValue("bg_tones"),
          depth: getSelectValue("bg_depth")
        }
      },
      artistry: {
        brushwork: getSelectValue("brushwork"),
        medium: getSelectValue("medium"),
        focus: getSelectValue("focus"),
        palette: getChipsValue("palette")
      },
      atmosphere: {
        tone: getSelectValue("atm_tone"),
        intent: getSelectValue("atm_intent")
      }
    };
    return { scene };
  }

  function updatePreview(){
    const data = buildPrompt();
    document.getElementById("jsonPreview").textContent = JSON.stringify(data, null, 2);
    saveDraft();
  }

  // ---------- Установка значений (для примера/черновика) ----------
  function setSelectByEnValue(id, enValue){
    const select = document.getElementById(id);
    const custom = document.getElementById(id + "_custom");
    const match = Array.from(select.options).find(o => o.value === enValue);
    if(match){
      select.value = enValue;
      custom.style.display = "none";
      custom.value = "";
    } else {
      select.value = CUSTOM_VALUE;
      custom.style.display = "block";
      custom.value = enValue || "";
    }
  }

  function setChipsByEnValues(id, enValues){
    const chips = document.querySelectorAll("#" + id + "_chips .chip");
    const known = new Set(Array.from(chips).map(c => c.getAttribute("data-en")));
    const leftover = [];
    chips.forEach(c => c.classList.remove("selected"));
    (enValues || []).forEach(v => {
      if(known.has(v)){
        Array.from(chips).find(c => c.getAttribute("data-en") === v).classList.add("selected");
      } else if(v){
        leftover.push(v);
      }
    });
    document.getElementById(id + "_custom").value = leftover.join(", ");
  }

  // ---------- Черновик в localStorage ----------
  function saveDraft(){
    const draft = { selects: {}, chips: {} };
    selectFieldIds.forEach(id => {
      draft.selects[id] = {
        value: document.getElementById(id).value,
        custom: document.getElementById(id + "_custom").value
      };
    });
    chipFieldIds.forEach(id => {
      const selected = Array.from(document.querySelectorAll("#" + id + "_chips .chip.selected"))
        .map(c => c.getAttribute("data-en"));
      draft.chips[id] = {
        selected: selected,
        custom: document.getElementById(id + "_custom").value
      };
    });
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
      document.getElementById("statusText").textContent = "Черновик сохранён " + new Date().toLocaleTimeString("ru-RU");
    }catch(e){
      document.getElementById("statusText").textContent = "Не удалось сохранить черновик";
    }
  }

  function loadDraft(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const draft = JSON.parse(raw);
      selectFieldIds.forEach(id => {
        const saved = draft.selects && draft.selects[id];
        if(!saved) return;
        const select = document.getElementById(id);
        const custom = document.getElementById(id + "_custom");
        select.value = saved.value || "";
        custom.value = saved.custom || "";
        custom.style.display = select.value === CUSTOM_VALUE ? "block" : "none";
      });
      chipFieldIds.forEach(id => {
        const saved = draft.chips && draft.chips[id];
        if(!saved) return;
        document.querySelectorAll("#" + id + "_chips .chip").forEach(c => {
          c.classList.toggle("selected", saved.selected.includes(c.getAttribute("data-en")));
        });
        document.getElementById(id + "_custom").value = saved.custom || "";
      });
    }catch(e){ /* игнорируем повреждённый черновик */ }
  }

  // ---------- Пример из исходного файла ----------
  const exampleSelects = {
    type: "realistic painting",
    comp_framing: "full figure in balanced composition",
    comp_position: "left side of the image",
    comp_setting: "stone stairway illuminated by gentle sunlight",
    subj_category: "adult woman",
    subj_posture: "seated in a relaxed, natural pose with feet resting on the step",
    hair_color: "dark brown",
    hair_length: "long",
    hair_texture: "slightly wavy",
    hair_lighting: "subtle rim light",
    skin_tone: "fair and softly lit",
    expression: "calm, thoughtful",
    outfit: "light beige dress",
    material: "thin fabric with natural texture",
    design: "simple, everyday style",
    light_source: "natural sunlight",
    light_temp: "warm golden hue",
    time_of_day: "late afternoon",
    bg_structure: "textured stone steps",
    bg_depth: "gradual fade into background light",
    brushwork: "impressionistic, soft transitions",
    medium: "oil on canvas",
    focus: "interaction of light and atmosphere",
    atm_tone: "peaceful observation",
    atm_intent: "capture"
  };

  const exampleChips = {
    style: ["impressionistic", "soft color palette", "fine art realism"],
    mood: ["serene", "reflective", "warm afternoon atmosphere"],
    light_details: ["soft rim lighting", "gentle gradients of shadow"],
    bg_tones: ["beige", "warm gray", "soft tan"],
    palette: ["muted gold", "warm earth tones", "soft beige highlights"]
  };

  function loadExample(){
    selectFieldIds.forEach(id => setSelectByEnValue(id, exampleSelects[id] || ""));
    chipFieldIds.forEach(id => setChipsByEnValues(id, exampleChips[id] || []));
    updatePreview();
  }

  function clearAll(){
    selectFieldIds.forEach(id => {
      document.getElementById(id).value = OPT[id][0][1];
      const custom = document.getElementById(id + "_custom");
      custom.value = "";
      custom.style.display = "none";
    });
    chipFieldIds.forEach(id => {
      document.querySelectorAll("#" + id + "_chips .chip").forEach(c => c.classList.remove("selected"));
      document.getElementById(id + "_custom").value = "";
    });
    localStorage.removeItem(STORAGE_KEY);
    updatePreview();
  }

  // ---------- Инициализация ----------
  renderForm();

  document.getElementById("loadExampleBtn").addEventListener("click", loadExample);

  document.getElementById("clearBtn").addEventListener("click", () => {
    if(!confirm("Очистить все поля формы?")) return;
    clearAll();
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    const data = buildPrompt();
    const text = JSON.stringify(data, null, 2);
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "prompt.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const data = buildPrompt();
    const text = JSON.stringify(data, null, 2);
    try{
      await navigator.clipboard.writeText(text);
      document.getElementById("statusText").textContent = "JSON скопирован в буфер обмена";
    }catch(e){
      document.getElementById("statusText").textContent = "Не удалось скопировать — скопируйте вручную";
    }
  });

  loadDraft();
  updatePreview();
</script>

</body>
</html>
